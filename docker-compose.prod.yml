version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: bracketa-app
    restart: always
    working_dir: /var/www
    env_file:
      - .env.production
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
    volumes:
      - .:/var/www
      - ./docker/php.ini:/usr/local/etc/php/conf.d/tournatak.ini
    networks:
      - tournatak-network
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: bracketa-nginx
    restart: always
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - tournatak-network
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: bracketa-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tournatak_laravel}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - tournatak-network

  redis:
    image: redis:alpine
    container_name: bracketa-redis
    restart: always
    command: redis-server --appendonly yes
    networks:
      - tournatak-network

  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: bracketa-queue
    restart: always
    working_dir: /var/www
    env_file:
      - .env.production
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
    command: php artisan queue:work --tries=3 --backoff=10
    volumes:
      - .:/var/www
    networks:
      - tournatak-network
    depends_on:
      - mysql
      - redis

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: bracketa-scheduler
    restart: always
    working_dir: /var/www
    env_file:
      - .env.production
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
    command: php artisan schedule:work
    volumes:
      - .:/var/www
    networks:
      - tournatak-network
    depends_on:
      - mysql
      - redis

networks:
  tournatak-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local

version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: bracketa-app
    restart: always
    working_dir: /var/www
    env_file:
      - .env.production
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
    volumes:
      - ./docker/php.ini:/usr/local/etc/php/conf.d/tournatak.ini
      - storage-data:/var/www/storage
      - public-data:/var/www/public/uploads
    networks:
      - tournatak-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: bracketa-nginx
    restart: always
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - public-data:/var/www/public/uploads
    networks:
      - tournatak-network
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: bracketa-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tournatak_laravel}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tournatak-network

  redis:
    image: redis:alpine
    container_name: bracketa-redis
    restart: always
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tournatak-network

  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: bracketa-queue
    restart: always
    working_dir: /var/www
    env_file:
      - .env.production
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
    command: php artisan queue:work --tries=3 --backoff=10
    volumes:
      - ./docker/php.ini:/usr/local/etc/php/conf.d/tournatak.ini
      - storage-data:/var/www/storage
      - public-data:/var/www/public/uploads
    networks:
      - tournatak-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: bracketa-scheduler
    restart: always
    working_dir: /var/www
    env_file:
      - .env.production
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
    command: php artisan schedule:work
    volumes:
      - ./docker/php.ini:/usr/local/etc/php/conf.d/tournatak.ini
      - storage-data:/var/www/storage
      - public-data:/var/www/public/uploads
    networks:
      - tournatak-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  tournatak-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  storage-data:
    driver: local
  public-data:
    driver: local
